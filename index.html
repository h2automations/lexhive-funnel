<!doctype html>
<html lang="en">
  <head>
    <!-- Google Tag Manager is loaded from src/main.tsx, not here: the container
         must NOT load on the /ops surface (internal page; no marketing tags may
         fire from it), and a static snippet in index.html cannot see the SPA
         route. Every tag — Meta Pixel, GA4, Clarity — is configured in the
         container; the app pushes to the dataLayer and GTM decides who hears
         about it; see src/lib/datalayer.ts. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Security Disability Support — See If Our Service May Be a Match</title>
    <meta name="description" content="Answer a few short questions to find out whether our disability support service may be a match for you. This is not an application for benefits — free and no obligation." />
  </head>
  <body>
    <!-- The Meta noscript pixel that used to be here is gone: tag firing belongs
         in the container now, and a hardcoded second copy of the dataset id is
         a thing that drifts. It cost nothing either way — this funnel is a
         React app, so a visitor without JavaScript cannot complete it. -->

    <div id="root"></div>


    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
